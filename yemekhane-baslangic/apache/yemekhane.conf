# =====================================================================
# Yemekhane · Apache yönlendirme ayarı
# Mod, docker-compose.yml içindeki "-D WEBAPI" ya da "-D MVC" ile seçilir.
# Uygulama adresi UYGULAMA_ADRES ortam değişkeninden gelir.
# =====================================================================
ServerName localhost
AddDefaultCharset UTF-8
DirectoryIndex index.html

ProxyPreserveHost On
ProxyTimeout 30

# Uygulamaya ulaşılamazsa (henüz yazılmadıysa ya da çöktüyse) bu sayfa gösterilir
ErrorDocument 502 /hata/503.html
ErrorDocument 503 /hata/503.html

# ---------------------------------------------------------------------
# WEB API + ARAYÜZ
#   /           -> frontend klasöründeki HTML/CSS/JS (Apache sunar)
#   /api/...    -> uygulama (yalnızca JSON döner)
# ---------------------------------------------------------------------
<IfDefine WEBAPI>
    ProxyPass        "/api/" "${UYGULAMA_ADRES}/api/"
    ProxyPassReverse "/api/" "${UYGULAMA_ADRES}/api/"
</IfDefine>

# ---------------------------------------------------------------------
# MVC
#   /css/, /img/, /js/, /hata/, /saglik.txt -> Apache sunar
#   geri kalan her şey                     -> uygulama (HTML sayfaları üretir)
# İstisnalar "/" satırından ÖNCE gelmelidir.
# ---------------------------------------------------------------------
<IfDefine MVC>
    ProxyPass "/css/"       "!"
    ProxyPass "/img/"       "!"
    ProxyPass "/js/"        "!"
    ProxyPass "/hata/"      "!"
    ProxyPass "/saglik.txt" "!"
    ProxyPass        "/" "${UYGULAMA_ADRES}/"
    ProxyPassReverse "/" "${UYGULAMA_ADRES}/"
</IfDefine>
